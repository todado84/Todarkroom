name: Build 50MP Film Darkroom APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/jihoon/darkroom
          mkdir -p app/src/main/assets
          cp app.html app/src/main/assets/index.html

          printf '%s\n' \
            'pluginManagement {' \
            '    repositories { google(); mavenCentral(); gradlePluginPortal() }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories { google(); mavenCentral() }' \
            '}' \
            'rootProject.name = "JihoonDarkroom"' \
            'include ":app"' > settings.gradle

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application" version "8.2.2" apply false' \
            '}' > build.gradle

          printf '%s\n' \
            'android.useAndroidX=true' \
            'org.gradle.jvmargs=-Xmx4096m' > gradle.properties

          printf '%s\n' \
            'plugins {' \
            '    id "com.android.application"' \
            '}' \
            'android {' \
            '    namespace "com.jihoon.darkroom"' \
            '    compileSdk 34' \
            '    defaultConfig {' \
            '        applicationId "com.jihoon.darkroom"' \
            '        minSdk 26' \
            '        targetSdk 34' \
            '        versionCode 1' \
            '        versionName "1.0"' \
            '    }' \
            '}' > app/build.gradle

          printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <application' \
            '        android:label="50MP Darkroom"' \
            '        android:largeHeap="true"' \
            '        android:hardwareAccelerated="true"' \
            '        android:theme="@android:style/Theme.DeviceDefault.NoActionBar">' \
            '        <activity' \
            '            android:name=".MainActivity"' \
            '            android:exported="true"' \
            '            android:configChanges="orientation|screenSize">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '</manifest>' > app/src/main/AndroidManifest.xml

          printf '%s\n' \
            'package com.jihoon.darkroom;' \
            'import android.app.Activity;' \
            'import android.content.Intent;' \
            'import android.net.Uri;' \
            'import android.os.Bundle;' \
            'import android.webkit.ValueCallback;' \
            'import android.webkit.WebChromeClient;' \
            'import android.webkit.WebSettings;' \
            'import android.webkit.WebView;' \
            'public class MainActivity extends Activity {' \
            '    private ValueCallback<Uri[]> uploadMessage;' \
            '    private final static int FILECHOOSER_RESULTCODE = 100;' \
            '    @Override' \
            '    protected void onCreate(Bundle savedInstanceState) {' \
            '        super.onCreate(savedInstanceState);' \
            '        WebView webView = new WebView(this);' \
            '        WebSettings s = webView.getSettings();' \
            '        s.setJavaScriptEnabled(true);' \
            '        s.setDomStorageEnabled(true);' \
            '        s.setAllowFileAccess(true);' \
            '        s.setAllowContentAccess(true);' \
            '        webView.setWebChromeClient(new WebChromeClient() {' \
            '            @Override' \
            '            public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {' \
            '                if (uploadMessage != null) uploadMessage.onReceiveValue(null);' \
            '                uploadMessage = filePathCallback;' \
            '                Intent intent = fileChooserParams.createIntent();' \
            '                try {' \
            '                    startActivityForResult(intent, FILECHOOSER_RESULTCODE);' \
            '                } catch (Exception e) {' \
            '                    uploadMessage = null;' \
            '                    return false;' \
            '                }' \
            '                return true;' \
            '            }' \
            '        });' \
            '        setContentView(webView);' \
            '        webView.loadUrl("file:///android_asset/index.html");' \
            '    }' \
            '    @Override' \
            '    protected void onActivityResult(int requestCode, int resultCode, Intent intent) {' \
            '        if (requestCode == FILECHOOSER_RESULTCODE && uploadMessage != null) {' \
            '            uploadMessage.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, intent));' \
            '            uploadMessage = null;' \
            '        }' \
            '    }' \
            '}' > app/src/main/java/com/jihoon/darkroom/MainActivity.java

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jihoon-50MP-Darkroom-APK
          path: app/build/outputs/apk/debug/app-debug.apk
