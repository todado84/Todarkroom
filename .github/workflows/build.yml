name: Build Film Darkroom APK

# 저장소에 이 파일(.github/workflows/build.yml)과 index.html 두 개만 있으면 됩니다.
# 실행: 저장소 → Actions → Build Film Darkroom APK → Run workflow (또는 push 하면 자동)
# 결과: 실행 화면 맨 아래 Artifacts → Film-Darkroom-APK (zip 안에 app-debug.apk)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 러너에 깔린 gradle 버전에 기대지 않고, 안드로이드 플러그인(AGP 8.2.2)과 맞는 8.7로 고정
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        run: |
          set -e
          PKG=app/src/main/java/com/jihoon/darkroom
          mkdir -p "$PKG" app/src/main/assets

          # 저장소 맨 위의 .html 하나를 앱 화면으로 사용
          HTML=$(ls *.html *.HTML 2>/dev/null | head -n 1 || true)
          if [ -z "$HTML" ]; then echo "::error::저장소 맨 위에 .html 파일이 없습니다"; exit 1; fi
          cp "$HTML" app/src/main/assets/index.html
          echo "사용한 HTML: $HTML"

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "FilmDarkroom"
          include ":app"
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id "com.android.application" version "8.2.2" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id "com.android.application"
          }
          android {
              namespace "com.jihoon.darkroom"
              compileSdk 34
              defaultConfig {
                  applicationId "com.jihoon.darkroom"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Film Darkroom"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > "$PKG/MainActivity.java" <<'EOF'
          package com.jihoon.darkroom;

          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import java.io.ByteArrayOutputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private ValueCallback<Uri[]> uploadMessage;
              private static final int FILECHOOSER_RESULTCODE = 100;
              private WebView webView;

              /** 웹 화면의 "저장"을 받아 갤러리 Pictures/Darkroom 에 JPG로 저장 (큰 파일은 조각으로 받음) */
              public class Bridge {
                  private ByteArrayOutputStream buf;
                  private String fileName;

                  @JavascriptInterface
                  public void begin(String name) {
                      fileName = name;
                      buf = new ByteArrayOutputStream();
                  }

                  @JavascriptInterface
                  public void append(String base64Chunk) {
                      byte[] b = Base64.decode(base64Chunk, Base64.DEFAULT);
                      buf.write(b, 0, b.length);
                  }

                  @JavascriptInterface
                  public String finish() {
                      try {
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Images.Media.DISPLAY_NAME, fileName);
                          v.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");
                          v.put(MediaStore.Images.Media.RELATIVE_PATH, Environment.DIRECTORY_PICTURES + "/Darkroom");
                          ContentResolver r = getContentResolver();
                          Uri uri = r.insert(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, v);
                          if (uri == null) return "ERROR: 저장 위치를 만들 수 없음";
                          try (OutputStream os = r.openOutputStream(uri)) {
                              buf.writeTo(os);
                          }
                          buf = null;
                          return "사진/Darkroom/" + fileName;
                      } catch (Exception e) {
                          return "ERROR: " + e.getMessage();
                      }
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  webView.addJavascriptInterface(new Bridge(), "AndroidBridge");

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (uploadMessage != null) uploadMessage.onReceiveValue(null);
                          uploadMessage = callback;
                          Intent intent = params.createIntent();
                          // accept 지정이 없으면(.cube 등) 모든 파일을 고를 수 있게
                          String[] types = params.getAcceptTypes();
                          if (types == null || types.length == 0 || types[0] == null || types[0].isEmpty()) {
                              intent.setType("*/*");
                          }
                          try {
                              startActivityForResult(intent, FILECHOOSER_RESULTCODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent intent) {
                  if (requestCode == FILECHOOSER_RESULTCODE && uploadMessage != null) {
                      uploadMessage.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, intent));
                      uploadMessage = null;
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Film-Darkroom-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
