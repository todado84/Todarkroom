name: Build 50MP Film Darkroom APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Project via Python
        run: |
          python3 - << 'EOF'
          import os, glob, shutil

          os.makedirs("app/src/main/java/com/jihoon/darkroom", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)

          # 대소문자 상관없이 html 파일 찾아서 복사
          html_files = glob.glob("*.html") + glob.glob("*.HTML")
          if html_files:
              shutil.copy(html_files[0], "app/src/main/assets/index.html")
          else:
              with open("app/src/main/assets/index.html", "w") as f:
                  f.write("<h1>app.html not found</h1>")

          with open("settings.gradle", "w") as f:
              f.write('''pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "JihoonDarkroom"
          include ":app"
          ''')

          with open("build.gradle", "w") as f:
              f.write('''plugins {
              id "com.android.application" version "8.1.4" apply false
          }
          ''')

          with open("gradle.properties", "w") as f:
              f.write('''android.useAndroidX=true
          org.gradle.jvmargs=-Xmx4096m
          ''')

          with open("app/build.gradle", "w") as f:
              f.write('''plugins {
              id "com.android.application"
          }
          android {
              namespace "com.jihoon.darkroom"
              compileSdk 34
              defaultConfig {
                  applicationId "com.jihoon.darkroom"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          ''')

          with open("app/src/main/AndroidManifest.xml", "w") as f:
              f.write('''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="50MP Darkroom"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ''')

          with open("app/src/main/java/com/jihoon/darkroom/MainActivity.java", "w") as f:
              f.write('''package com.jihoon.darkroom;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              private ValueCallback<Uri[]> uploadMessage;
              private final static int FILECHOOSER_RESULTCODE = 100;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView wv, ValueCallback<Uri[]> filePathCallback, FileChooserParams fileChooserParams) {
                          if (uploadMessage != null) uploadMessage.onReceiveValue(null);
                          uploadMessage = filePathCallback;
                          Intent intent = fileChooserParams.createIntent();
                          try {
                              startActivityForResult(intent, FILECHOOSER_RESULTCODE);
                          } catch (Exception e) {
                              uploadMessage = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent intent) {
                  if (requestCode == FILECHOOSER_RESULTCODE && uploadMessage != null) {
                      uploadMessage.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, intent));
                      uploadMessage = null;
                  }
              }
          
